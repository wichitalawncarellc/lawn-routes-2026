<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Route Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
:root{--g:#2d6a2d;--gl:#3d8c3d;--gp:#e8f5e8;--gm:#c5e5c5;--a:#e07b00;--ap:#fff3e0;--bg:#f7f9f7;--text:#1a2e1a;--muted:#6b8a6b;--border:#d4e8d4}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding-bottom:30px}.header{background:#1a1a1a;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px #0003}.top{display:flex;align-items:center;gap:9px}.logo{height:36px;width:auto}.switch{display:flex;gap:5px;flex:1}.switch button,.refresh,.week{border-radius:20px;font-family:inherit;font-weight:700;cursor:pointer}.switch button{padding:7px 11px;font-size:12px;border:1px solid #ffffff66;background:transparent;color:#ffffffcc}.switch button.active{background:#fff;color:var(--g);border-color:#fff}.refresh{padding:5px 10px;background:#ffffff22;border:1px solid #ffffff55;color:#fff;font-size:15px}.week{padding:5px 10px;background:#ffffff22;border:1px solid #ffffff55;color:#fff;font-size:11px}.sync{text-align:center;color:#ffffff88;font:10px 'DM Mono',monospace;margin-top:8px}.main{max-width:520px;margin:auto;padding:14px}.summary{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px;color:var(--muted);font-size:13px}.summary b{color:var(--g)}.day-section{scroll-margin-top:78px;margin-bottom:22px}.day-head{display:flex;align-items:center;justify-content:space-between;background:var(--g);color:#fff;padding:9px 12px;border-radius:10px;margin-bottom:9px;box-shadow:0 2px 6px #2d6a2d22}.day-name{font-weight:800;font-size:14px;letter-spacing:.5px}.day-progress{font:11px 'DM Mono',monospace;opacity:.9}.card{background:#fff;border:1.5px solid var(--border);border-radius:14px;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 8px #2d6a2d14}.card.done{opacity:.55;background:var(--gp);border-color:var(--gm)}.card.notes{border-left:4px solid var(--a)}.row{display:flex;gap:11px;padding:13px;align-items:flex-start}.check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--border);background:#fff;flex:none;cursor:pointer;color:#fff;font-size:16px;font-weight:bold}.check.on{background:var(--gl);border-color:var(--gl)}.info{flex:1;min-width:0}.num{font:700 10px 'DM Mono',monospace;color:var(--muted);margin-bottom:2px}.address{font-size:15px;font-weight:650;line-height:1.3}.done .address{text-decoration:line-through;color:var(--muted)}.customer{font-size:12px;color:var(--muted);margin-top:3px}.note{margin:0 13px 12px;padding:8px 10px;background:var(--ap);border:1px solid #f5c06b;border-radius:8px;color:#7a4500;font-size:12px}.actions{display:flex;gap:6px;padding:0 13px 13px}.action{flex:1;text-align:center;text-decoration:none;padding:8px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--g);font-size:12px;font-weight:700}.reset{width:100%;padding:10px;border:1.5px dashed var(--border);border-radius:8px;background:transparent;color:var(--muted);font-family:inherit;font-weight:600}.loading,.empty,.error{text-align:center;padding:55px 20px;color:var(--muted)}.spin{display:inline-block;width:34px;height:34px;border:3px solid var(--gm);border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite;margin-bottom:12px}@keyframes s{to{transform:rotate(360deg)}}.overlay{position:fixed;inset:0;background:#0008;z-index:200;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 30px;max-height:70vh;overflow:auto}.sheet h3{margin-bottom:10px}.opt{padding:13px 10px;border-radius:8px;font-weight:650;cursor:pointer}.opt.sel{background:var(--gp);border:1px solid var(--g)}
</style></head>
<body>
<div class="header"><div class="top"><img class="logo" src="assets/route-manager-logo.jpg" alt="Wichita Lawn Care"><div class="switch"><button id="cur" class="active" onclick="switchSource('current')">This Week</button><button id="prev" onclick="switchSource('prev')">Last Week</button></div><button class="refresh" onclick="fetchData(true)">↻</button><button class="week" onclick="openWeeks()"><span id="weekLabel">Week</span> ▾</button></div><div class="sync" id="sync"></div></div>
<div class="main" id="main"><div class="loading"><div class="spin"></div><div>Loading your routes...</div></div></div>
<div class="overlay" id="overlay" onclick="closeWeeks()"><div class="sheet" onclick="event.stopPropagation()"><h3>Select Week</h3><div id="weekOptions"></div></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import { getDatabase, ref, onValue, set, remove } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDZLr2fOxmDTZ37nj9FeaSUdsTkXWIkxFE',authDomain:'wichita-lawn-care-route.firebaseapp.com',databaseURL:'https://wichita-lawn-care-route-default-rtdb.firebaseio.com',projectId:'wichita-lawn-care-route',storageBucket:'wichita-lawn-care-route.firebasestorage.app',messagingSenderId:'1054062295516',appId:'1:1054062295516:web:1940689005dcf6c1adf719'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const BASE='https://script.google.com/macros/s/AKfycbxi3S_Lqfu2lZD7kUoq0x6lTR7_QRAlU2KbDezuFOIaoL5LZxh9UstOOg1mCc-cRy4C/exec';
let source='current',weeks={},weekOrder=[],weekIdx=0,lastFetched=null,initialScroll=true,done={},firebaseReady=false,unsubscribeDone=null;
function safe(s){return btoa(unescape(encodeURIComponent(String(s)))).replace(/[.#$\[\]/=+]/g,'_')}
function key(w,d,i){return `${source}||${w}||${d}||${i}`}
function completionPath(){return `completionStatus/${safe(source)}/${safe(weekOrder[weekIdx]||'week')}`}
function subscribeDone(){if(unsubscribeDone)unsubscribeDone();if(!firebaseReady||!weekOrder.length)return;unsubscribeDone=onValue(ref(db,completionPath()),snap=>{done=snap.val()||{};render()})}
function doneKey(d,i){let s=stops(d)[i];return safe(`${d}|${s?.address||''}`)}
function isDone(d,i){return !!done[doneKey(d,i)]}
async function toggle(d,i){if(!firebaseReady)return;let k=doneKey(d,i),r=ref(db,completionPath()+'/'+k);try{if(isDone(d,i))await remove(r);else await set(r,{complete:true,address:stops(d)[i].address,day:d,updatedAt:Date.now()})}catch(e){console.error('Completion sync failed',e)}}
async function resetDay(d){if(!firebaseReady)return;let jobs=[];stops(d).forEach((_,i)=>{if(isDone(d,i))jobs.push(remove(ref(db,completionPath()+'/'+doneKey(d,i))))});try{await Promise.all(jobs)}catch(e){console.error('Reset failed',e)}}
function parseCSV(text){const lines=text.trim().split('\n'),heads=splitCSV(lines[0]);return lines.slice(1).map(line=>{const c=splitCSV(line),r={};heads.forEach((h,i)=>r[h.trim()]=(c[i]||'').trim());return r}).filter(r=>r.Address)}
function splitCSV(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function build(rows){let ws={},order=[];rows.forEach(r=>{let w=r.Week||'Unknown',d=(r.Day||'').toUpperCase().trim();if(!d)return;if(!ws[w]){ws[w]={};order.push(w)}if(!ws[w][d])ws[w][d]=[];ws[w][d].push({address:r.Address||'',notes:r.Notes||'',customer:r.Customer||'',phone:r.Phone||''})});return{ws,order:[...new Set(order)]}}
async function fetchData(manual=false){let oldScroll=window.scrollY;try{let url=BASE+(source==='prev'?'?sheet=prev':'');let res=await fetch(url);if(!res.ok)throw Error('HTTP '+res.status);let rows=parseCSV(await res.text());if(!rows.length)throw Error('No route data found');let b=build(rows);weeks=b.ws;weekOrder=b.order;if(weekIdx>=weekOrder.length)weekIdx=0;lastFetched=new Date();subscribeDone();render();if(initialScroll&&source==='current'){initialScroll=false;setTimeout(scrollToday,80)}else if(manual){setTimeout(()=>window.scrollTo(0,oldScroll),0)}}catch(e){document.getElementById('main').innerHTML=`<div class="error">⚠️ Could not load routes.<br><small>${e.message}</small></div>`}}
function days(){let order=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY','CLEANUPS'],x=weeks[weekOrder[weekIdx]]||{};return order.filter(d=>x[d]?.length)}
function stops(d){return (weeks[weekOrder[weekIdx]]||{})[d]||[]}
function render(){let ds=days(),w=weekOrder[weekIdx]||'Week',total=ds.reduce((n,d)=>n+stops(d).length,0),finished=ds.reduce((n,d)=>n+stops(d).filter((_,i)=>isDone(d,i)).length,0);document.getElementById('weekLabel').textContent=w;document.getElementById('sync').textContent=(firebaseReady?'Live checkmarks • ':'Connecting checkmarks • ')+(lastFetched?'Routes synced '+lastFetched.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'');let html=`<div class="summary"><span>${total} lawns this week</span><b>${finished}/${total} complete</b></div>`;ds.forEach(d=>{let ss=stops(d),dc=ss.filter((_,i)=>isDone(d,i)).length;html+=`<section class="day-section" id="day-${d}"><div class="day-head"><span class="day-name">${d.charAt(0)+d.slice(1).toLowerCase()}</span><span class="day-progress">${dc}/${ss.length} done</span></div>`;ss.forEach((s,i)=>{let yes=isDone(d,i),notes=!!s.notes,phone=(s.phone||'').replace(/[^0-9]/g,''),map=`https://maps.google.com/?q=${encodeURIComponent(s.address+', Wichita, KS')}`;html+=`<div class="card${yes?' done':''}${notes?' notes':''}"><div class="row"><button class="check${yes?' on':''}" onclick="window.routeToggle('${d}',${i})">${yes?'✓':''}</button><div class="info"><div class="num">${i+1}/${ss.length} · ${d}</div><div class="address">${s.address}</div>${s.customer?`<div class="customer">👤 ${s.customer}</div>`:''}</div></div>${notes?`<div class="note">⚠️ ${s.notes.replace(/\|/g,' • ')}</div>`:''}<div class="actions"><a class="action" href="${map}" target="_blank">📍 Navigate</a>${phone.length>=7?`<a class="action" href="tel:${phone}">📞 ${s.phone}</a>`:''}</div></div>`});if(dc>0)html+=`<button class="reset" onclick="window.routeReset('${d}')">↺ Reset ${d.charAt(0)+d.slice(1).toLowerCase()} checkmarks</button>`;html+='</section>'});document.getElementById('main').innerHTML=html||'<div class="empty">No stops found</div>'}
function scrollToday(){let names=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'],el=document.getElementById('day-'+names[new Date().getDay()]);if(el)el.scrollIntoView({block:'start'})}
function switchSource(s){if(s===source)return;source=s;weekIdx=0;initialScroll=s==='current';document.getElementById('cur').classList.toggle('active',s==='current');document.getElementById('prev').classList.toggle('active',s==='prev');document.getElementById('main').innerHTML='<div class="loading"><div class="spin"></div><div>Loading routes...</div></div>';fetchData(true)}
function openWeeks(){let box=document.getElementById('weekOptions');box.innerHTML=weekOrder.map((w,i)=>`<div class="opt${i===weekIdx?' sel':''}" onclick="window.chooseWeek(${i})">Week of ${w}</div>`).join('');document.getElementById('overlay').classList.add('open')}
function closeWeeks(){document.getElementById('overlay').classList.remove('open')}
function chooseWeek(i){weekIdx=i;closeWeeks();subscribeDone();render();window.scrollTo(0,0)}
window.routeToggle=toggle;window.routeReset=resetDay;window.switchSource=switchSource;window.openWeeks=openWeeks;window.closeWeeks=closeWeeks;window.chooseWeek=chooseWeek;window.fetchData=fetchData;
signInAnonymously(auth).then(()=>{firebaseReady=true;subscribeDone();render()}).catch(e=>{console.error('Firebase auth failed',e);document.getElementById('sync').textContent='Checkmark connection failed'});
fetchData();setInterval(()=>fetchData(true),10*60*1000);
</script></body></html>
