name: Assemble Route Manager Upload

on:
  push:
    paths:
      - '.route-upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble uploaded index.html
        shell: bash
        run: |
          cat .route-upload/part-*.txt | base64 -d > index.html
          rm -rf .route-upload
          rm -f .github/workflows/route-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Route Manager from uploaded HTML"
          git push
