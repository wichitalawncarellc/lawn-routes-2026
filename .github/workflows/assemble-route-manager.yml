name: Assemble Route Manager

on:
  push:
    branches: [route-manager-cleanup]
    paths:
      - '.route-update/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble files
        shell: bash
        run: |
          cat .route-update/part-* > /tmp/route-manager-update.b64
          base64 -d /tmp/route-manager-update.b64 > /tmp/route-manager-update.tgz
          tar -xzf /tmp/route-manager-update.tgz
          rm -rf .route-update
          rm -f .github/workflows/assemble-route-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Route Manager and extract logo asset"
          git push
