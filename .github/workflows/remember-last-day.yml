name: Remember Last Route Day
on:
  push:
    branches: [main]
    paths:
      - '.route-remember-day-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Route Manager day persistence
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace("function saveDone() {\n  try { localStorage.setItem('routeDone', JSON.stringify(done)); } catch(e) {}\n}\nfunction getKey", "function saveDone() {\n  try { localStorage.setItem('routeDone', JSON.stringify(done)); } catch(e) {}\n}\nfunction loadSavedDay() {\n  try { return localStorage.getItem('routeLastDay'); } catch(e) { return null; }\n}\nfunction saveCurrentDay() {\n  try {\n    if (currentDay) localStorage.setItem('routeLastDay', currentDay);\n  } catch(e) {}\n}\nfunction getKey")
          s = s.replace("    currentWeekIdx = 0;\n    currentDay = null;", "    currentWeekIdx = 0;\n    currentDay = loadSavedDay();", 1)
          s = s.replace("  if (!currentDay || !days.includes(currentDay)) currentDay = days[0] || null;", "  if (!currentDay || !days.includes(currentDay)) currentDay = days[0] || null;\n  saveCurrentDay();")
          s = s.replace("function selectDay(day) {\n  currentDay = day;\n  renderTabs();", "function selectDay(day) {\n  currentDay = day;\n  saveCurrentDay();\n  renderTabs();")
          s = s.replace("function selectWeek(idx) {\n  currentWeekIdx = idx;\n  currentDay = null;", "function selectWeek(idx) {\n  currentWeekIdx = idx;\n  currentDay = loadSavedDay();")
          p.write_text(s)
      - name: Clean up one-time workflow files
        run: rm -f .route-remember-day-trigger .github/workflows/remember-last-day.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .route-remember-day-trigger .github/workflows/remember-last-day.yml
          git commit -m "Remember last selected route day"
          git push